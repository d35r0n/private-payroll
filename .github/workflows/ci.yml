name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check managed contract artifacts are up-to-date
        # The compact compiler is not available in CI runners.
        # Developers who modify payroll_contract.compact MUST regenerate managed/
        # locally (npm run compile) and commit the updated artifacts before pushing.
        # This step enforces that invariant using git commit history.
        run: |
          SOURCE="contracts/payroll_contract.compact"
          ARTIFACT="contracts/managed/payroll/contract/index.js"
          if [ ! -f "$ARTIFACT" ]; then
            echo "ERROR: Compiled artifact '$ARTIFACT' is missing."
            echo "Run 'npm run compile' locally (requires the Midnight compact compiler)"
            echo "and commit the updated managed/ folder before pushing."
            exit 1
          fi
          SOURCE_TIME=$(git log -1 --format=%ct -- "contracts/payroll_contract.compact" "contracts/circuits" 2>/dev/null || echo 0)
          ARTIFACT_TIME=$(git log -1 --format=%ct -- "contracts/managed" 2>/dev/null || echo 0)
          if [ "$SOURCE_TIME" -gt "$ARTIFACT_TIME" ]; then
            echo "ERROR: Compact contract source files were modified in git after managed artifacts."
            echo "The Compact source was modified without regenerating managed artifacts."
            echo "Run 'npm run compile' locally and commit the updated managed/ folder."
            exit 1
          fi
          echo "✅ Managed artifacts are up-to-date."

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build
